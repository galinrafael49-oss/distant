<html>
<head>
    <meta charset="utf-8">
    <title>Стихотворение</title>
</head>
<body>
    <script>
        document.write(`
            <h1>Зимнее утро</h1>
            <h3>Александр Сергеевич Пушкин</h3>
            <div>
                <p>Мороз и солнце; день чудесный!</p>
                <p>Еще ты дремлешь, друг прелестный —</p>
                <p>Пора, красавица, проснись:</p>
                <p>Открой сомкнуты негой взоры</p>
                <p>Навстречу северной Авроры,</p>
                <p>Звездою севера явись!</p>
            </div>
        `);
    </script>
</body>

</html>
